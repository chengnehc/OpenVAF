[package]
name = "mir_llvm"
version = "0.0.0"
authors = ["DSPOM"]
edition = "2021"
license = "GPL-3.0"

[lib]
doctest = false

[dependencies]

base_n = { version = "1", path = "../../lib/base_n" }
mir = { version = "0.0.0", path = "../mir" }
llvm = { version = "0.0.0", path = "../llvm" }
target = { version = "0.0.0", path = "../target" }

ahash = "0.8"
arrayvec = "0.7"
typed-index-collections = "3"
lasso = { version = "0.7", features = ["ahash"] }
log = "0.4"
