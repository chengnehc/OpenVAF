[package]
name = "mir_autodiff"
version = "0.0.0"
authors = ["DSPOM"]
edition = "2021"
license = "GPL-3.0"

[lib]
doctest = false

[dependencies]
stdx = { version = "0.0.0", path = "../../lib/stdx" }
workqueue = { version = "0.0.0", path = "../../lib/workqueue" }
bitset = { version = "0.0.0", path = "../../lib/bitset" }
typed_indexmap = { version = "0.0.0", path = "../../lib/typed_indexmap" }
arena = { version = "0.0.0", path = "../../lib/arena" }

mir = { version = "0.0.0", path = "../mir" }

ahash = "0.8"
indexmap = "2.0"
typed-index-collections = "3"

[dev-dependencies]
mir_reader = { version = "0.0.0", path = "../mir_reader" }
mir_interpret = { version = "0.0.0", path = "../mir_interpret" }

expect-test = "1.4"
float-cmp = "0.9"
