[package]
name = "hir"
version = "0.0.0"
authors = ["DSPOM"]
edition = "2021"
license="GPL-3.0"

[badges]
maintenance = { status = "actively-developed" }

[lib]
doctest = false

[dependencies]
stdx = {version = "0.0.0", path = "../../lib/stdx" }

syntax = {version = "0.0.0", path = "../syntax"}
basedb = {version = "0.0.0", path = "../basedb" }
hir_def = {version = "0.0.0", path = "../hir_def" }
hir_ty = {version = "0.0.0", path = "../hir_ty" }

anyhow = "1"
ahash = "0.8"
indexmap = "2.0"
typed-index-collections = "3"
smol_str = { version = "0.3", default-features = false }
parking_lot = "0.12"

salsa = "0.17.0-pre.2"

[dev-dependencies]
expect-test = "1.4"
mini_harness = { version = "0.0.1", path = "../../lib/mini_harness" }
indoc = "2"

[[test]]
name = "data_tests"
harness = false
